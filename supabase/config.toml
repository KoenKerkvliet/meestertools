# Supabase CLI-configuratie. Wordt gelezen bij `supabase functions deploy`.
#
# Belangrijk: zonder deze instellingen deployt de CLI elke functie met
# verify_jwt = true. Voor send-keepalive-notification zou dat de functie breken,
# want die wordt door de GitHub Action aangeroepen zonder token.

project_id = "chnjybpwquystuwmiger"

# --- Leerlingkant: geen account, wel de publieke anon-key als JWT ---
[functions.leerling]
verify_jwt = true

[functions.complimentenmuur]
verify_jwt = true

[functions.escaperoom-sessie]
verify_jwt = true

[functions.rekenrace-sessie]
verify_jwt = true

[functions.typrace-sessie]
verify_jwt = true

# --- Mail ---
[functions.send-password-reset-email]
verify_jwt = true

# Een ingelogde leerkracht zet zichzelf op de wachtlijst van 10minutendidactiek.
[functions.wachtlijst-aanmelden]
verify_jwt = true

# Wordt door pg_cron (via pg_net) aangeroepen, dus zonder JWT. De functie
# controleert zelf een gedeeld geheim uit public.opruim_geheim.
[functions.account-opruiming]
verify_jwt = false

# Idem: pg_cron roept hem aan met het gedeelde geheim. De proefmail uit beheer
# controleert zijn eigen JWT in de functie.
[functions.feedback-mail]
verify_jwt = false

# Idem: de database roept hem aan met het gedeelde geheim.
[functions.nieuwsbrief-sync]
verify_jwt = false

# Idem: de database roept hem aan bij een nieuw tijdlijnvoorstel.
[functions.tijdlijn-melding]
verify_jwt = false

# Idem: de database roept hem elke dag om 17.00 uur aan met het gedeelde geheim.
[functions.dagoverzicht]
verify_jwt = false

# Wordt extern aangeroepen (keepalive), dus zonder JWT.
[functions.send-keepalive-notification]
verify_jwt = false
