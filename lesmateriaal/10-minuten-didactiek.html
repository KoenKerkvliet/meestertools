<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Korte instructielessen van tien minuten volgens ik-wij-jullie-jij.">
    <meta name="theme-color" content="#6C63FF">
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>Meestertools - 10-minuten-didactiek</title>
    <link rel="stylesheet" href="../css/style.css?v=1.58.4">

    <link rel="stylesheet" href="../css/tien-minuten.css?v=1.58.4">

<body>
    <header id="app-header-slot"></header>

    <main class="tool-page-content has-grid">
        <a href="../lesmateriaal" class="back-link">&larr; Terug naar lesmateriaal</a>
        <div class="tool-page-header">
            <span class="page-icon">&#9201;&#65039;</span>
            <h1>10-minuten-didactiek</h1>
            <p>Korte instructielessen volgens ik, wij, jullie, jij. Kies een vak.</p>
        </div>
        <div class="tools-grid" data-no-lift>
            <a href="10-minuten-didactiek/rekenen" class="tool-card vak-card">
                <span class="card-icon">&#129518;</span>
                <h3>Rekenen</h3>
                <p>Lijngrafieken, gewicht, tijd als kommagetal, verhoudingen.</p>
            </a>
            <div class="tool-card vak-card is-soon" aria-disabled="true">
                <span class="soon-badge">Binnenkort</span>
                <span class="card-icon">&#9999;&#65039;</span>
                <h3>Spelling</h3>
                <p>Nog geen lessen.</p>
            </div>
            <div class="tool-card vak-card is-soon" aria-disabled="true">
                <span class="soon-badge">Binnenkort</span>
                <span class="card-icon">&#128214;</span>
                <h3>Taal</h3>
                <p>Nog geen lessen.</p>
            </div>
        </div>
    </main>

    <footer id="app-footer-slot"></footer>

    <script src="/js/mt-shared.js?v=1.58.4"></script>
    <script src="/js/template.js?v=1.58.4"></script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>

    <script src="../js/app.js?v=1.58.4"></script>
    <script src="/js/active-class.js?v=1.58.4"></script>
    <script src="../js/instellingen.js?v=1.58.4"></script>
</body>
</html>
