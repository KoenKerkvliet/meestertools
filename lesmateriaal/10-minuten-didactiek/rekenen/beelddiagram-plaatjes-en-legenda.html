<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><link rel="icon" type="image/svg+xml" href="/favicon.svg"></head><body style="margin:0">
<title>Wat is één plaatje waard?</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700;800&family=Kalam:wght@700&display=swap">
<style>

    --blue:#2F6BD8; --blue-soft:#DCE7FA; --red:#E04E2A; --red-soft:#FCE3DA;
    --green:#1F8A5B; --green-soft:#DDF1E6; --amber:#B7791F; --amber-soft:#FBEFD9;
    --card:#FFFFFF; --line:#CFD7E2;
    color-scheme: light;
  }
  html,body{height:100%}
  body{
    background:var(--paper);
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:28px 28px;
    color:var(--ink); font-family:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif; font-size:18px; line-height:1.45;
  }
  .app{display:flex;flex-direction:column;min-height:100%;padding-inline:clamp(16px,2.5vw,40px);padding-block:14px;gap:14px;box-sizing:border-box;max-width:1500px;margin:0 auto}
  header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;justify-content:space-between}
  .brand{font-weight:800;font-size:1.15rem;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
  .brand svg{flex:none}
  .phases{display:flex;flex-wrap:wrap;gap:6px}
  .chip{border:2px solid var(--line);background:var(--card);color:var(--ink-soft);border-radius:999px;padding:4px 14px;font:inherit;font-size:.85rem;font-weight:500;cursor:pointer}
  .chip.on{border-color:var(--ink);background:var(--ink);color:#fff}
  .chip:focus-visible,.btn:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
  main{flex:1;display:flex}
  .screen{flex:1;display:grid;gap:clamp(16px,2vw,28px);align-content:start}
  .card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:clamp(16px,2vw,28px)}
  .tag{display:inline-block;font-size:.8rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border-radius:6px}
  .tag.voordoen{background:var(--blue-soft);color:var(--blue)}
  .tag.samen{background:var(--amber-soft);color:var(--amber)}
  .tag.zelf{background:var(--green-soft);color:var(--green)}
  h1{font-size:clamp(2rem,4.4vw,3.6rem);line-height:1.05;margin:0;letter-spacing:-.02em;text-wrap:balance}
  h2{font-size:clamp(1.3rem,2.3vw,2rem);line-height:1.2;margin:0;text-wrap:balance}
  p{margin:0}
  /* opdracht layout */
  .task{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);align-items:start}
  .chartbox{padding:12px 12px 4px}
  .chartbox .ctitle{font-weight:700;font-size:1.05rem;padding:4px 8px 0;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
  button.chartbox{font:inherit;color:inherit;text-align:left;cursor:zoom-in;width:100%}
  button.chartbox:hover{border-color:var(--blue)}
  button.chartbox:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
  .zoomhint{font-weight:500;font-size:.85rem;color:var(--blue)}
  .zoom{position:fixed;inset:0;z-index:50;background:var(--paper);display:flex;flex-direction:column;gap:10px;
    padding:calc(12px + env(safe-area-inset-top,0px)) clamp(16px,2vw,32px) calc(12px + env(safe-area-inset-bottom,0px))}
  .zbar{display:flex;justify-content:space-between;align-items:center;gap:12px 20px;flex-wrap:wrap}
  .zq{font-size:clamp(1.2rem,2vw,1.8rem);font-weight:700;line-height:1.25;flex:1 1 30ch}
  .zq .tag{vertical-align:middle;margin-right:6px}
  .zchart{flex:1;min-height:0;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px;cursor:zoom-out;display:flex}
  .zchart svg{width:100%;height:100%;display:block}
  .zstep{font-family:"Kalam",cursive;color:var(--red);font-size:clamp(1.4rem,2.6vw,2.2rem);line-height:1.2;text-align:center}
  .chartbox svg{width:100%;height:auto;display:block}
  .side{display:grid;gap:16px}
  .q{font-size:clamp(1.25rem,2.1vw,1.9rem);font-weight:700;line-height:1.25;text-wrap:balance}
  .q small{display:block;font-size:.62em;font-weight:500;color:var(--ink-soft);margin-top:6px}
  .steps{list-style:none;margin:0;padding:0;display:grid;gap:10px}
  .steps li{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;padding:10px 12px;border-radius:10px;background:var(--paper);border:2px solid transparent;font-size:1.02rem}
  .steps li .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--card);border:2px solid var(--line);color:var(--ink-soft)}
  .steps li .t b{display:block;font-size:.95rem}
  .steps li .t span{color:var(--ink)}
  .steps li.hide .t span{visibility:hidden}
  .steps li.cur{border-color:var(--red);background:var(--red-soft)}
  .steps li.done .n,.steps li.cur .n{background:var(--ink);border-color:var(--ink);color:#fff}
  .note{border-left:5px solid var(--blue);background:var(--blue-soft);padding:10px 14px;border-radius:0 10px 10px 0;font-size:.95rem}
  .note b{display:block;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
  .answer{font-family:"Kalam",cursive;font-size:clamp(1.3rem,2.2vw,1.9rem);color:var(--red);line-height:1.2}
  .actions{display:flex;flex-wrap:wrap;gap:10px}
  .btn{font:inherit;font-weight:700;border-radius:10px;padding:10px 18px;cursor:pointer;border:2px solid var(--ink);background:var(--card);color:var(--ink)}
  .btn.primary{background:var(--red);border-color:var(--red);color:#fff}
  .btn:disabled{opacity:.4;cursor:default}
  footer{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .count{color:var(--ink-soft);font-size:.9rem;font-variant-numeric:tabular-nums}
  .keys{color:var(--ink-soft);font-size:.8rem}
  /* intro */
  .intro{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:stretch}
  .goal{font-size:clamp(1.15rem,1.9vw,1.6rem);font-weight:500;margin-top:14px;max-width:34ch}
  .words{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .word{border-radius:12px;padding:14px 16px;border:2px solid var(--line);background:var(--card)}
  .word .w{font-weight:800;font-size:1.25rem}
  .word .m{color:var(--ink-soft);font-size:.95rem}
  .word.up{border-color:#9FD3B8;background:var(--green-soft)}
  .word.down{border-color:#F3B5A3;background:var(--red-soft)}
  .word.wide{grid-column:1/-1}
  .plan{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
  .plan .card{display:grid;gap:8px;align-content:start}
  .plan .big{font-size:2.4rem;font-weight:800;color:var(--red);line-height:1}
  .plan h2{font-size:clamp(1.1rem,1.7vw,1.45rem)}
  .answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .answers .card{display:grid;gap:6px}
  .hand{font-family:"Kalam",cursive;color:var(--red);font-size:1.35rem;line-height:1.2}
  @media (max-width:900px){
    .task,.intro{grid-template-columns:1fr}
    .plan{grid-template-columns:repeat(2,minmax(0,1fr))}
    .answers{grid-template-columns:1fr}
    .keys{display:none}
  }
  @media (max-width:520px){ .plan,.words{grid-template-columns:1fr} }
  @media (prefers-reduced-motion:no-preference){
    .hl{animation:draw .6s ease-out both}
    @keyframes draw{from{stroke-dashoffset:400}to{stroke-dashoffset:0}}
  }
  /* MeesterTools */
  .mt-kop{display:flex;align-items:center;gap:14px}
  .mt-kop .terug{font-weight:700;font-size:.95rem;color:var(--ink-soft);text-decoration:none;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:6px 12px}
  .mt-kop .terug:hover{color:var(--ink);border-color:var(--ink)}
  .mt-kop img{height:46px;display:block;margin:-6px 0}
  body:not(.eerste-dia) .brand{visibility:hidden}
</style>

function chartSVG(it, st){
  const rowH=66, top=96, W=860, L=190, S=52, I=44;
  const H=top+it.rows.length*rowH+16;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Beelddiagram: ${it.title}">`;
  s+=`<rect x="0" y="0" width="${W}" height="${H}" fill="#FFFFFF"/>`;
  // legenda
  const legTxt=`= ${fmt(it.per)} ${it.noun}`, legW=96+legTxt.length*12.5;
  const on=st>=1;
  s+=`<text x="18" y="18" font-size="13" font-weight="700" fill="#56647C" font-family="Lexend" letter-spacing="1.5">LEGENDA</text>`;
  s+=`<rect x="16" y="26" width="${legW}" height="54" rx="10" fill="${on?'#FCE3DA':'#F6F7F2'}" stroke="${on?'#E04E2A':'#CFD7E2'}" stroke-width="${on?3:2}"/>`;
  s+=`<g transform="translate(28,31) scale(1.1)">${ICONS[it.icon]}</g>`;
  s+=`<text x="82" y="61" font-size="22" font-weight="700" fill="#1C2A44" font-family="Lexend">${legTxt}</text>`;
  it.rows.forEach((r,i)=>{
    const [label,n,hidden]=r, y0=top+i*rowH, hot=st>=2&&it.hi.includes(i), cy=y0+rowH/2;
    if(hot) s+=`<rect x="8" y="${y0+3}" width="${W-16}" height="${rowH-6}" rx="10" fill="#FCE3DA"/>`;
    s+=`<line x1="16" x2="${W-16}" y1="${y0+rowH}" y2="${y0+rowH}" stroke="#E6EBF1" stroke-width="1.5"/>`;
    s+=`<text x="${L-18}" y="${cy+7}" text-anchor="end" font-size="20" font-weight="${hot?700:500}" fill="#1C2A44" font-family="Lexend">${label}</text>`;
    const showIcons = !hidden || st>=4;
    if(showIcons){
      for(let k=0;k<Math.ceil(n);k++){
        const f=Math.min(1,n-k), x=L+k*S, y=cy-I/2;
        if(f<1){
          const id='c'+(++CLIP);
          s+=`<clipPath id="${id}"><rect x="${x}" y="${y}" width="${I*0.15+I*0.7*f}" height="${I}"/></clipPath>`;
          s+=`<g clip-path="url(#${id})"><g transform="translate(${x},${y}) scale(${I/40})">${ICONS[it.icon]}</g></g>`;
        } else {
          s+=`<g transform="translate(${x},${y}) scale(${I/40})">${ICONS[it.icon]}</g>`;
        }
      }
    } else {
      s+=`<text x="${L+6}" y="${cy+12}" font-size="34" font-weight="800" fill="#E04E2A" font-family="Lexend">?</text>`;
    }
    const ax = showIcons ? L+Math.ceil(n)*S+10 : L+44;
    const val=n*it.per;
    if(st>=3 && it.hi.includes(i)){
      const t = hidden
        ? (st>=4 ? `${fmt(val)} : ${it.per} = ${frac(n)}` : `${fmt(val)} : ${it.per} = …`)
        : `${frac(n)} × ${fmt(it.per)} = ${fmt(val)}`;
      s+=`<text x="${ax}" y="${cy+9}" font-size="26" font-weight="700" fill="#E04E2A" font-family="Kalam">${t}</text>`;
    }
  });
  return s+'</svg>';
}

function renderPhases(){
  const ph = SCREENS[cur].phase;
  document.getElementById('phases').innerHTML = PHASES.map(p=>
    `<button type="button" class="chip ${p.key===ph?'on':''}" data-phase="${p.key}">${p.label}</button>`).join('');
}

function render(){
  const sc=SCREENS[cur], m=document.getElementById('main');
  if(sc.kind==='intro'){
    m.innerHTML=`<section class="screen intro">
      <div class="card" style="display:grid;gap:14px;align-content:start">
        <span class="tag voordoen" style="justify-self:start">Lesdoel</span>
        <h1>${INTRO.h1}</h1>
        <p class="goal">${INTRO.goal}</p>
        <div class="note"><b>Valkuil</b>${INTRO.valkuil}</div>
      </div>
      <div class="words">${INTRO.words.map(w=>`<div class="word ${w[2]}"><div class="w">${w[0]}</div><div class="m">${w[1]}</div></div>`).join('')}</div></section>`;
  } else if(sc.kind==='plan'){
    const P=PLAN;
    m.innerHTML=`<section class="screen"><div style="display:grid;gap:6px"><span class="tag voordoen" style="justify-self:start">Stappenplan</span><h1>Zo pak je het aan</h1></div>
      <div class="plan">${P.map((p,i)=>`<div class="card"><div class="big">${i+1}</div><h2>${p[0]}</h2><p>${p[1]}</p></div>`).join('')}</div></section>`;
  } else if(sc.kind==='task'){
    const it=ITEMS[sc.idx], n=sc.idx+1;
    const stepNames=STEPNAMES;
    m.innerHTML=`<section class="screen task">
      <button type="button" class="card chartbox" id="zoomOpen" aria-label="Grafiek groot in beeld"><div class="ctitle"><span>${it.title}</span><span class="zoomhint">⤢ Klik om te vergroten</span></div>${chartSVG(it,stage)}</button>
      <div class="side">
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="tag ${it.phase}">${PHASE_NAME[it.phase]}</span><strong>Opdracht ${n}</strong></div>
        <div class="q">${it.q}${it.sub?`<small>${it.sub}</small>`:''}</div>
        <ol class="steps">${it.steps.map((t,i)=>{
          const c = i<stage-1?'done':(i===stage-1?'cur':'hide');
          return `<li class="${c}"><span class="n">${i+1}</span><span class="t"><b>${stepNames[i]}</b><span>${t}</span></span></li>`;}).join('')}</ol>
        ${stage>=4?`<div class="answer">${it.answer}</div>`:''}
        <div class="actions">
          <button class="btn primary" id="stepBtn" type="button" ${stage>=4?'disabled':''}>${it.phase==='zelf'&&stage===0?'Nabespreken: stap 1':'Volgende stap'}</button>
          <button class="btn" id="resetBtn" type="button" ${stage===0?'disabled':''}>Opnieuw</button>
        </div>
        ${it.note?`<div class="note"><b>${it.phase==='voordoen'?'Hardop denken (leerkracht)':'Tip voor het samen doen'}</b>${it.note}</div>`:''}
      </div></section>`;
    document.getElementById('stepBtn').onclick=()=>{ if(stage<4){stage++;render();} };
    document.getElementById('resetBtn').onclick=()=>{ stage=0;render(); };
    document.getElementById('zoomOpen').onclick=()=>{ zoom=true; render(); };
    if(zoom){
      const ov=document.createElement('div');
      ov.className='zoom'; ov.setAttribute('role','dialog'); ov.setAttribute('aria-label','Grafiek groot');
      ov.innerHTML=`<div class="zbar">
          <div class="zq"><span class="tag ${it.phase}">Opdracht ${n}</span> ${it.q}</div>
          <div class="actions">
            <button class="btn primary" id="zStep" type="button" ${stage>=4?'disabled':''}>Volgende stap</button>
            <button class="btn" id="zClose" type="button">✕ Sluiten</button>
          </div></div>
        <div class="zchart">${chartSVG(it,stage)}</div>
        ${stage>=1?`<div class="zstep">${stage>=4?it.answer:it.steps[stage-1]}</div>`:''}`;
      m.appendChild(ov);
      document.getElementById('zStep').onclick=()=>{ if(stage<4){stage++;render();} };
      document.getElementById('zClose').onclick=()=>{ zoom=false; render(); };
      ov.querySelector('.zchart').onclick=()=>{ zoom=false; render(); };
    }
  } else {
    const Z=ITEMS.slice(6);
    m.innerHTML=`<section class="screen"><div style="display:grid;gap:6px"><span class="tag zelf" style="justify-self:start">Nabespreken</span><h1>Antwoorden 7 t/m 10</h1></div>
      <div class="answers">${Z.map((it,i)=>`<div class="card"><strong>Opdracht ${i+7} · ${it.title}</strong><div class="hand">${it.answer}</div></div>`).join('')}</div>
      <h2>${DENK.h2}</h2>
      <p>${DENK.p}</p></div></section>`;
  }
  document.getElementById('count').textContent=`${cur+1} / ${SCREENS.length}`;
  document.getElementById('prev').disabled = cur===0;
  document.getElementById('next').disabled = cur===SCREENS.length-1;
  renderPhases();
  document.body.classList.toggle("eerste-dia",cur===0);
}

function go(i){ if(i<0||i>=SCREENS.length) return; cur=i; stage=0; if(SCREENS[i].kind!=='task') zoom=false; render(); window.scrollTo(0,0); }
document.getElementById('prev').onclick=()=>go(cur-1);
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('phases').addEventListener('click',e=>{
  const b=e.target.closest('[data-phase]'); if(!b) return;
  go(SCREENS.findIndex(s=>s.phase===b.dataset.phase));
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape' && zoom){ zoom=false; render(); }
  else if((e.key==='z'||e.key==='Z') && SCREENS[cur].kind==='task'){ zoom=!zoom; render(); }
  else if(e.key==='ArrowRight'||e.key==='PageDown'){ e.preventDefault(); go(cur+1); }
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); go(cur-1); }
  else if((e.key===' '||e.key==='Enter') && SCREENS[cur].kind==='task' && !(e.target.closest&&e.target.closest('button'))){
    e.preventDefault(); if(stage<4){stage++;render();}
  }
});
render();
</script>
</body></html>
