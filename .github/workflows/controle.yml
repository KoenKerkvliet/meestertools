name: Controle

# Kleine vangnetten op elke push. De site heeft geen build-stap, dus dit is
# de enige plek waar iets fout kan gaan vóórdat een leerkracht het merkt.
#
#  1. Draait elk JS-bestand door de parser van Node (vangt typefouten).
#  2. Controleert of de ?v=-cache-busting in de HTML nog gelijkloopt met de
#     VERSION in js/template.js. Zo niet: draai `node scripts/set-version.js`.
#  3. Controleert dat elke pagina js/mt-shared.js op tijd inlaadt, en dat
#     niemand weer een eigen kopie van een gedeelde helper heeft gemaakt.
#  4. Parseert elke edge function. `node --check` kan geen TypeScript, dus
#     dat gaat via esbuild - zonder deze stap merk je een typefout in een
#     edge function pas als de deploy erop stukloopt.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  controle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: JS-syntax controleren
        run: |
          fout=0
          for f in js/*.js scripts/*.js; do
            if ! node --check "$f"; then
              echo "::error file=$f::syntaxfout"
              fout=1
            fi
          done
          exit $fout

      - name: Cache-busting in sync met de versie
        run: node scripts/set-version.js --check

      - name: Gedeelde helpers correct ingeladen
        run: node scripts/check-shared.js

      - name: Edge functions parsen (TypeScript)
        run: |
          fout=0
          for f in supabase/functions/*/index.ts supabase/functions/_shared/*.ts; do
            if ! npx --yes esbuild@0.24.0 "$f" --loader:.ts=ts --outfile=/dev/null; then
              echo "::error file=$f::parsefout"
              fout=1
            fi
          done
          exit $fout
