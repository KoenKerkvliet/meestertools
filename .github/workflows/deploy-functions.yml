name: Edge functions deployen

# De site zelf gaat via GitHub Pages automatisch live, maar de edge functions
# werden met de hand gedeployd. Daardoor kon de code in git afwijken van wat er
# draait — en client en server moeten juist samen mee: verandert bijvoorbeeld
# een pad of een antwoordveld, dan is een half gedeploye wijziging stuk.
#
# Deze workflow deployt alleen de functies die in de push zijn gewijzigd.
# Wijzigt er iets in _shared/, dan gaan ze allemaal, want die code zit in elke
# functie gebundeld.
#
# Eenmalig instellen: repo -> Settings -> Secrets and variables -> Actions ->
# New repository secret, naam SUPABASE_ACCESS_TOKEN, waarde een persoonlijk
# access token uit https://supabase.com/dashboard/account/tokens

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
  workflow_dispatch:
    inputs:
      alles:
        description: 'Alle functies deployen in plaats van alleen de gewijzigde'
        type: boolean
        default: true

env:
  PROJECT_REF: chnjybpwquystuwmiger

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Bepalen welke functies mee moeten
        id: kies
        run: |
          alle() {
            find supabase/functions -mindepth 1 -maxdepth 1 -type d \
              ! -name '_shared' -printf '%f\n' | sort
          }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            lijst=$(alle)
            reden="handmatig gestart"
          elif ! git rev-parse HEAD^ >/dev/null 2>&1; then
            lijst=$(alle)
            reden="geen vorige commit om mee te vergelijken"
          else
            gewijzigd=$(git diff --name-only HEAD^ HEAD -- supabase/ || true)
            if echo "$gewijzigd" | grep -qE '^supabase/(functions/_shared/|config\.toml)'; then
              lijst=$(alle)
              reden="_shared of config.toml gewijzigd"
            else
              lijst=$(echo "$gewijzigd" | grep '^supabase/functions/' \
                | cut -d/ -f3 | grep -v '^_shared$' | sort -u)
              reden="gewijzigd in deze push"
            fi
          fi

          echo "Reden: $reden"
          echo "Functies:"; echo "${lijst:-(geen)}"
          echo "lijst<<EOF" >> "$GITHUB_OUTPUT"
          echo "$lijst" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - uses: supabase/setup-cli@v1
        if: steps.kies.outputs.lijst != ''
        with:
          version: latest

      - name: Deployen
        if: steps.kies.outputs.lijst != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Secret SUPABASE_ACCESS_TOKEN ontbreekt. Zie de uitleg boven in dit workflow-bestand."
            exit 1
          fi
          fout=0
          while read -r fn; do
            [ -z "$fn" ] && continue
            echo "::group::$fn"
            if supabase functions deploy "$fn" --project-ref "$PROJECT_REF"; then
              echo "$fn gedeployd"
            else
              echo "::error::deploy van $fn mislukte"
              fout=1
            fi
            echo "::endgroup::"
          done <<< "${{ steps.kies.outputs.lijst }}"
          exit $fout
