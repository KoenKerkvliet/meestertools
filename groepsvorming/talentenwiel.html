<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Talentenwiel voor in de klas: maak zichtbaar waar elk kind goed in is. Draai het wiel, zet een leerling in het zonnetje en verzamel samen de talenten van de klas. Onderdeel van Meestertools.">
    <meta name="theme-color" content="#6C63FF">
    <link rel="canonical" href="https://meestertools.nl/groepsvorming/talentenwiel">

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://meestertools.nl/groepsvorming/talentenwiel">
    <meta property="og:title" content="Talentenwiel voor in de klas - Meestertools">
    <meta property="og:description" content="Maak zichtbaar waar elk kind goed in is. Draai het wiel, zet een leerling in het zonnetje en verzamel samen de talenten van de klas.">
    <meta property="og:image" content="https://meestertools.nl/assets/og-image.png">
    <meta property="og:locale" content="nl_NL">
    <meta property="og:site_name" content="Meestertools">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Talentenwiel voor in de klas - Meestertools">
    <meta name="twitter:description" content="Maak zichtbaar waar elk kind goed in is en trots op is.">
    <meta name="twitter:image" content="https://meestertools.nl/assets/og-image.png">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>Talentenwiel - Meestertools</title>
    <link rel="stylesheet" href="../css/style.css?v=1.52.0">
    <link rel="stylesheet" href="../css/instellingen.css?v=1.52.0">
    <link rel="stylesheet" href="../css/talentenwiel.css?v=1.52.0">
</head>
<body>
    <header id="app-header-slot"></header>

    <main class="tool-page-content">
        <div class="tool-inline-header">
            <a href="../groepsvorming" class="back-link">&larr; Terug</a>
            <div class="tool-inline-title">
                <h1>Talentenwiel</h1>
                <p>Draai het wiel en zet een leerling met z'n talenten in het zonnetje.</p>
            </div>
        </div>
        <div class="tool-page-body">
            <div class="tw-wrap">
                <!-- Weergave-schakelaar -->
                <div class="tw-tabs">
                    <button class="tw-tab active" data-view="wiel">&#127920; Wiel</button>
                    <button class="tw-tab" data-view="overzicht">&#11088; Alle talenten</button>
                </div>

                <!-- Wiel-weergave -->
                <div class="tw-view" id="twViewWiel">
                    <div class="tw-wheel-area">
                        <div class="tw-wheel-wrapper">
                            <div class="tw-pointer"></div>
                            <canvas id="twCanvas" width="520" height="520"></canvas>
                        </div>
                        <button class="tw-spin-btn" id="twSpinBtn">Draai het wiel!</button>
                    </div>

                    <!-- Spotlight na het draaien -->
                    <div class="tw-spotlight" id="twSpotlight" style="display:none;">
                        <span class="tw-spot-emoji">&#11088;</span>
                        <h2 id="twSpotName"></h2>
                        <div class="tw-spot-talents" id="twSpotTalents"></div>
                        <p class="tw-spot-ask" id="twSpotAsk" style="display:none;">Welke talenten heeft deze leerling? Vraag het de klas!</p>
                        <button class="tw-edit-btn" id="twSpotEdit">Talenten invullen &#9998;</button>
                    </div>
                </div>

                <!-- Overzicht-weergave -->
                <div class="tw-view" id="twViewOverzicht" style="display:none;">
                    <p class="tw-stats" id="twStats"></p>
                    <div class="tw-grid" id="twGrid"></div>
                </div>

                <!-- Lege staat -->
                <div class="tw-empty" id="twEmpty" style="display:none;">
                    <span class="tw-empty-icon">&#11088;</span>
                    <h2>Nog geen leerlingen</h2>
                    <p>Kies rechtsboven je klas, of voeg leerlingen toe via <strong>Instellingen &rarr; Mijn klas</strong>.</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal: talenten van een leerling -->
    <div class="modal-overlay" id="twModal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="twModalTitle">Talenten</h2>
                <button class="modal-close" id="twModalClose">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Gekozen talenten <span class="tw-max-hint">(max 4)</span></label>
                    <div class="tw-chosen" id="twChosen"></div>
                </div>
                <div class="form-group">
                    <label>Kies uit suggesties</label>
                    <div class="tw-suggestions" id="twSuggestions"></div>
                </div>
                <div class="form-group">
                    <label for="twCustomInput">Of typ een eigen talent</label>
                    <div class="tw-custom-row">
                        <input type="text" id="twCustomInput" maxlength="30" placeholder="Bijv. goochelen">
                        <button class="tw-add-btn" id="twCustomAdd">+</button>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-primary" id="twModalSave">Opslaan</button>
            </div>
        </div>
    </div>

    <footer id="app-footer-slot"></footer>

    <script src="/js/mt-shared.js?v=1.52.0"></script>
    <script src="/js/template.js?v=1.52.0"></script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
    <script src="../js/supabase-config.js?v=1.52.0"></script>
    <script src="../js/app.js?v=1.52.0"></script>
    <script src="/js/active-class.js?v=1.52.0"></script>
    <script src="../js/instellingen.js?v=1.52.0"></script>
    <script src="../js/talentenwiel.js?v=1.52.0"></script>
</body>
</html>
