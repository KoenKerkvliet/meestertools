<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Doelenbord voor in de klas: elke leerling stelt een eigen mini-doel, werkt eraan en reflecteert. Met klassendoel en overzicht op het digibord. Onderdeel van Meestertools.">
    <meta name="theme-color" content="#6C63FF">
    <link rel="canonical" href="https://meestertools.nl/groepsvorming/doelenbord">

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://meestertools.nl/groepsvorming/doelenbord">
    <meta property="og:title" content="Doelenbord voor in de klas - Meestertools">
    <meta property="og:description" content="Elke leerling stelt een eigen mini-doel, werkt eraan en reflecteert. Met klassendoel en overzicht op het digibord.">
    <meta property="og:image" content="https://meestertools.nl/assets/og-image.png">
    <meta property="og:locale" content="nl_NL">
    <meta property="og:site_name" content="Meestertools">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Doelenbord voor in de klas - Meestertools">
    <meta name="twitter:description" content="Elke leerling stelt een eigen mini-doel, werkt eraan en reflecteert.">
    <meta name="twitter:image" content="https://meestertools.nl/assets/og-image.png">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>Doelenbord - Meestertools</title>
    <link rel="stylesheet" href="../css/style.css?v=1.56.0">
    <link rel="stylesheet" href="../css/instellingen.css?v=1.56.0">
    <link rel="stylesheet" href="../css/doelenbord.css?v=1.56.0">
</head>
<body>
    <header id="app-header-slot"></header>

    <main class="tool-page-content">
        <div class="tool-inline-header">
            <a href="../groepsvorming" class="back-link">&larr; Terug</a>
            <div class="tool-inline-title">
                <h1>Doelenbord</h1>
                <p>Elke leerling een eigen mini-doel: stellen, eraan werken en samen vieren.</p>
            </div>
        </div>
        <div class="tool-page-body">
            <div class="db-wrap">
                <!-- Klassendoel -->
                <div class="db-classgoal" id="dbClassGoal">
                    <span class="db-classgoal-icon">&#127942;</span>
                    <div class="db-classgoal-text">
                        <span class="db-classgoal-label">Klassendoel</span>
                        <strong id="dbClassGoalText">Nog geen klassendoel &mdash; klik om er samen &eacute;&eacute;n te bedenken.</strong>
                    </div>
                    <button class="db-classgoal-done" id="dbClassGoalDone" title="Klassendoel gehaald!">&#127881;</button>
                </div>

                <!-- Statistiek -->
                <p class="db-stats" id="dbStats"></p>

                <!-- Leerling-kaarten -->
                <div class="db-grid" id="dbGrid"></div>

                <!-- Lege staat -->
                <div class="db-empty" id="dbEmpty" style="display:none;">
                    <span class="db-empty-icon">&#127919;</span>
                    <h2>Nog geen leerlingen</h2>
                    <p>Kies rechtsboven je klas, of voeg leerlingen toe via <strong>Instellingen &rarr; Mijn klas</strong>.</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal: doel van een leerling -->
    <div class="modal-overlay" id="dbModal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="dbModalTitle">Doel</h2>
                <button class="modal-close" id="dbModalClose">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="dbGoalInput">Mijn doel</label>
                    <input type="text" id="dbGoalInput" maxlength="120" placeholder="Bijv. Ik steek deze week 3 keer mijn vinger op">
                </div>
                <div class="form-group">
                    <label>Hoe gaat het?</label>
                    <div class="db-status-seg" id="dbStatusSeg">
                        <button data-status="bezig" class="active">&#128170; Ik ben bezig</button>
                        <button data-status="gelukt">&#127881; Gelukt!</button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="dbReflectInput">Reflectie <span class="db-optional">(optioneel)</span></label>
                    <textarea id="dbReflectInput" rows="2" maxlength="240" placeholder="Wat ging goed? Wat was lastig?"></textarea>
                </div>
            </div>
            <div class="modal-footer db-modal-footer">
                <button class="db-btn-delete" id="dbModalDelete">Doel verwijderen</button>
                <button class="btn-primary" id="dbModalSave">Opslaan</button>
            </div>
        </div>
    </div>

    <!-- Modal: klassendoel -->
    <div class="modal-overlay" id="dbClassModal">
        <div class="modal">
            <div class="modal-header">
                <h2>Klassendoel</h2>
                <button class="modal-close" id="dbClassModalClose">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="dbClassGoalInput">Ons doel als klas</label>
                    <input type="text" id="dbClassGoalInput" maxlength="120" placeholder="Bijv. Wij ruimen elke dag samen op in 2 minuten">
                </div>
            </div>
            <div class="modal-footer db-modal-footer">
                <button class="db-btn-delete" id="dbClassModalDelete">Verwijderen</button>
                <button class="btn-primary" id="dbClassModalSave">Opslaan</button>
            </div>
        </div>
    </div>

    <footer id="app-footer-slot"></footer>

    <script src="/js/mt-shared.js?v=1.56.0"></script>
    <script src="/js/template.js?v=1.56.0"></script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
    <script src="../js/supabase-config.js?v=1.56.0"></script>
    <script src="../js/app.js?v=1.56.0"></script>
    <script src="/js/active-class.js?v=1.56.0"></script>
    <script src="../js/instellingen.js?v=1.56.0"></script>
    <script src="../js/doelenbord.js?v=1.56.0"></script>
</body>
</html>
