<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Een tool van Meestertools - het digitale platform voor de basisschool.">
    <meta name="theme-color" content="#6C63FF">
    <link rel="canonical" href="https://meestertools.nl/digibord/podium">

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://meestertools.nl/digibord/podium">
    <meta property="og:title" content="Meestertools - Podium">
    <meta property="og:description" content="Een tool van Meestertools - het digitale platform voor de basisschool.">
    <meta property="og:image" content="https://meestertools.nl/assets/og-image.png">
    <meta property="og:locale" content="nl_NL">
    <meta property="og:site_name" content="Meestertools">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Meestertools - Podium">
    <meta name="twitter:description" content="Een tool van Meestertools - het digitale platform voor de basisschool.">
    <meta name="twitter:image" content="https://meestertools.nl/assets/og-image.png">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>Meestertools - Podium</title>
    <link rel="stylesheet" href="../css/style.css?v=1.50.0">
    <link rel="stylesheet" href="../css/instellingen.css?v=1.50.0">
    <link rel="stylesheet" href="../css/podium.css?v=1.50.0">
</head>
<body>
    <header id="app-header-slot"></header>

    <main class="tool-page-content">
        <div class="tool-inline-header">
            <a href="../digibordtools" class="back-link">&larr; Terug</a>
            <div class="tool-inline-title">
                <h1>Podium</h1>
                <p>Onthul de winnaars van je klas op een Olympisch podium.</p>
            </div>
            <button class="tool-settings-btn" id="btnSettings" title="Instellingen">&#9881;&#65039;</button>
        </div>
        <div class="tool-page-body">
            <div class="podium-container">
                <!-- De blokken worden door podium.js gebouwd: het aantal plaatsen
                     is een instelling (1 t/m 5). -->
                <div class="podium-stage"></div>

                <div class="podium-action">
                    <button class="podium-reveal-btn" id="btnReveal">Onthul!</button>
                </div>

                <div class="podium-empty" id="emptyState" style="display:none;">
                    <div class="empty-icon">&#127942;</div>
                    <p>Stel via de instellingen in wie er op het podium staan.</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Confetti canvas -->
    <canvas id="confettiCanvas"></canvas>

    <!-- Settings modal -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <div class="modal-header">
                <h2>Instellingen</h2>
                <button class="modal-close" id="btnCloseSettings">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="settingGroup">Groep</label>
                    <select id="settingGroup">
                        <option value="">Selecteer groep...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="settingCount">Aantal podiumplaatsen</label>
                    <select id="settingCount">
                        <option value="1">1 &mdash; alleen de winnaar</option>
                        <option value="2">2 plaatsen</option>
                        <option value="3">3 plaatsen (goud, zilver, brons)</option>
                        <option value="4">4 plaatsen</option>
                        <option value="5">5 plaatsen</option>
                    </select>
                </div>
                <!-- Eén select per plaats, van de laagste plaats naar de winnaar:
                     dezelfde volgorde als waarin ze straks onthuld worden. -->
                <div id="placeFields" style="display:none;"></div>
                <p class="podium-hint" id="settingsHint" style="display:none;"></p>
            </div>
            <div class="modal-footer">
                <button class="btn-primary" id="btnSaveSettings">Opslaan</button>
            </div>
        </div>
    </div>

    <footer id="app-footer-slot"></footer>

    <script src="/js/mt-shared.js?v=1.50.0"></script>
    <script src="/js/template.js?v=1.50.0"></script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
    <script src="../js/supabase-config.js?v=1.50.0"></script>
    <script src="../js/app.js?v=1.50.0"></script>
    <script src="../js/instellingen.js?v=1.50.0"></script>
    <script src="../js/podium.js?v=1.50.0"></script>
</body>
</html>
